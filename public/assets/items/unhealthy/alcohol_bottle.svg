<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="liquorAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="55%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="wineRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <!-- Liquor Bottle (Left-Back) -->
  <g transform="rotate(-6 46 64)">
    <!-- Cork/Cap -->
    <rect x="38" y="10" width="16" height="9" rx="2" fill="#DC2626" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Neck -->
    <rect x="39" y="19" width="14" height="21" fill="url(#liquorAmber)" stroke="#1E293B" stroke-width="3"/>
    <rect x="37" y="24" width="18" height="5" rx="1.5" fill="#FACC15" stroke="#1E293B" stroke-width="2"/>
    <!-- Shoulders & Body -->
    <path d="M 39 40 C 39 48, 24 50, 24 64 L 24 108 C 24 112, 27 114, 31 114 L 61 114 C 65 114, 68 112, 68 108 L 68 64 C 68 50, 53 48, 53 40 Z"
          fill="url(#liquorAmber)" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Cream Label with XXX -->
    <rect x="27" y="64" width="38" height="32" rx="2" fill="#FEF3C7" stroke="#1E293B" stroke-width="2"/>
    <text x="46" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#991B1B" letter-spacing="1">XXX</text>
    <!-- Highlight -->
    <line x1="30" y1="62" x2="30" y2="106" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  </g>
  <!-- Wine Glass (Right-Front) -->
  <g transform="translate(6, 4)">
    <!-- Bowl outer -->
    <path d="M 66 44 L 102 44 C 102 68, 94 78, 84 78 C 74 78, 66 68, 66 44 Z"
          fill="#E0F2FE" fill-opacity="0.75" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Red wine inside bowl -->
    <path d="M 68 56 L 100 56 C 99 70, 92 76, 84 76 C 76 76, 69 70, 68 56 Z"
          fill="url(#wineRed)"/>
    <!-- Stem & Base -->
    <line x1="84" y1="78" x2="84" y2="106" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="84" cy="108" rx="15" ry="4" fill="#BAE6FD" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Glass shine -->
    <path d="M 71 49 C 71 57, 73 64, 76 68" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
