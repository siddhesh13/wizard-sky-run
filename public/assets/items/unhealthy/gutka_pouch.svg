<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gutkaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="55%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-6 64 64)">
    <!-- Serrated foil sachet body with tear notch on right -->
    <path d="M 26 16 L 32 20 L 38 16 L 44 20 L 50 16 L 56 20 L 62 16 L 68 20 L 74 16 L 80 20 L 86 16 L 92 20 L 102 16
             L 102 30 L 95 34 L 102 38
             L 102 112 L 92 108 L 86 112 L 80 108 L 74 112 L 68 108 L 62 112 L 56 108 L 50 112 L 44 108 L 38 112 L 32 108 L 26 112 Z"
          fill="url(#gutkaRed)" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    <!-- Top & bottom crimp lines -->
    <line x1="26" y1="26" x2="102" y2="26" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 2"/>
    <line x1="26" y1="102" x2="102" y2="102" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 2"/>
    <!-- Green pan-leaf accent motif at top -->
    <path d="M 64 29 C 56 32, 54 40, 64 44 C 74 40, 72 32, 64 29 Z" fill="#16A34A" stroke="#1E293B" stroke-width="1.8"/>
    <!-- Bright Gold Banner -->
    <rect x="28" y="46" width="72" height="26" rx="3" fill="url(#goldBand)" stroke="#1E293B" stroke-width="2.5"/>
    <text x="64" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#7F1D1D" letter-spacing="0.5">GUTKA</text>
    <!-- Skull & crossbones warning emblem at bottom -->
    <line x1="53" y1="81" x2="75" y2="93" stroke="#FEF2F2" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="75" y1="81" x2="53" y2="93" stroke="#FEF2F2" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="64" cy="84" r="6.5" fill="#FEF2F2" stroke="#1E293B" stroke-width="2"/>
    <rect x="60.5" y="88" width="7" height="4.5" rx="1.2" fill="#FEF2F2" stroke="#1E293B" stroke-width="1.8"/>
    <circle cx="61.8" cy="83.5" r="1.4" fill="#1E293B"/>
    <circle cx="66.2" cy="83.5" r="1.4" fill="#1E293B"/>
    <!-- Foil shine strip -->
    <rect x="31" y="21" width="5" height="86" rx="2" fill="#FFFFFF" opacity="0.25"/>
  </g>
</svg>
