<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- French Fries on left-back -->
  <g transform="rotate(-10 42 64)">
    <rect x="24" y="26" width="6" height="34" rx="2" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="32" y="20" width="6" height="38" rx="2" fill="#FDE047" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="40" y="23" width="6" height="36" rx="2" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="48" y="28" width="6" height="32" rx="2" fill="#EAB308" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Red fry carton -->
    <path d="M 20 50 C 32 56, 46 56, 58 50 L 53 96 L 25 96 Z"
          fill="#DC2626" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Burger on right-front -->
  <g transform="translate(8, 6)">
    <!-- Top sesame bun -->
    <path d="M 40 62 C 40 42, 104 42, 104 62 Z" fill="#F59E0B" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="60" cy="51" rx="2.5" ry="1.5" fill="#FEF3C7"/>
    <ellipse cx="73" cy="48" rx="2.5" ry="1.5" fill="#FEF3C7"/>
    <ellipse cx="85" cy="52" rx="2.5" ry="1.5" fill="#FEF3C7"/>
    <!-- Lettuce wave -->
    <path d="M 37 64 Q 45 70 53 64 Q 61 70 69 64 Q 77 70 85 64 Q 93 70 107 64"
          fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
    <!-- Melted cheese -->
    <polygon points="42,68 102,68 74,80" fill="#FACC15" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Beef/Patty -->
    <rect x="38" y="72" width="68" height="12" rx="6" fill="#78350F" stroke="#1E293B" stroke-width="3"/>
    <!-- Bottom bun -->
    <path d="M 40 84 L 104 84 L 101 94 C 100 97, 44 97, 43 94 Z"
          fill="#D97706" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
