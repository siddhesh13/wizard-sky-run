  <rect x="52" y="12" width="16" height="8" rx="2" fill="#0284C7" stroke="#1E293B" stroke-width="2.5"/>
  <rect x="48" y="20" width="24" height="8" rx="3" fill="#1D4ED8" stroke="#1E293B" stroke-width="3"/>
