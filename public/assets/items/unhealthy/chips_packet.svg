<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chipsBagRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="crispChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Dark bag interior behind chips -->
  <ellipse cx="64" cy="42" rx="34" ry="10" fill="#450A0A" stroke="#1E293B" stroke-width="3"/>
  <!-- Golden potato chips bursting out of open top -->
  <ellipse cx="46" cy="34" rx="14" ry="18" transform="rotate(-24 46 34)" fill="url(#crispChip)" stroke="#1E293B" stroke-width="2.8"/>
  <ellipse cx="80" cy="33" rx="14" ry="18" transform="rotate(22 80 33)" fill="url(#crispChip)" stroke="#1E293B" stroke-width="2.8"/>
  <ellipse cx="63" cy="28" rx="16" ry="19" transform="rotate(-5 63 28)" fill="url(#crispChip)" stroke="#1E293B" stroke-width="2.8"/>
  <!-- Open crinkled front bag body -->
  <path d="M 28 42 Q 46 49 64 43 Q 82 49 100 42
           C 104 66, 104 92, 100 112
           L 93 108 L 86 112 L 79 108 L 72 112 L 64 108 L 56 112 L 49 108 L 42 112 L 35 108 L 28 112
           C 24 92, 24 66, 28 42 Z"
        fill="url(#chipsBagRed)" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
  <!-- Yellow banner with bold CHIPS text -->
  <rect x="31" y="62" width="66" height="26" rx="6" fill="#FACC15" stroke="#1E293B" stroke-width="2.5"/>
  <text x="64" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#7F1D1D" letter-spacing="0.5">CHIPS</text>
  <!-- Two crunchy chips sitting in front bottom-right -->
  <ellipse cx="92" cy="104" rx="13" ry="9" transform="rotate(-18 92 104)" fill="url(#crispChip)" stroke="#1E293B" stroke-width="2.5"/>
  <ellipse cx="102" cy="110" rx="12" ry="8" transform="rotate(14 102 110)" fill="url(#crispChip)" stroke="#1E293B" stroke-width="2.5"/>
</svg>
