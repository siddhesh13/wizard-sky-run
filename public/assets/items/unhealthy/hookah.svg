<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="baseWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Smoke wisp -->
  <path d="M 46 16 C 42 10, 52 8, 48 4" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <!-- Flexible hose loop -->
  <path d="M 56 64 C 82 54, 108 62, 106 86 C 104 106, 82 106, 84 86 C 85 75, 96 70, 108 62"
        fill="none" stroke="#7C3AED" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 56 64 C 82 54, 108 62, 106 86 C 104 106, 82 106, 84 86 C 85 75, 96 70, 108 62"
        fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>
  <!-- Mouthpiece -->
  <line x1="104" y1="65" x2="114" y2="56" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Top bowl & glowing coal -->
  <ellipse cx="48" cy="20" rx="8" ry="4" fill="#EF4444" stroke="#1E293B" stroke-width="2"/>
  <path d="M 38 22 L 58 22 L 54 34 L 42 34 Z" fill="#991B1B" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tray -->
  <ellipse cx="48" cy="36" rx="16" ry="3.5" fill="url(#goldStem)" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Central metal shaft -->
  <rect x="44" y="36" width="8" height="36" fill="url(#goldStem)" stroke="#1E293B" stroke-width="2.5"/>
  <circle cx="48" cy="52" r="6" fill="url(#goldStem)" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Bulbous glass base -->
  <path d="M 39 72 L 57 72 C 66 84, 72 98, 66 112 C 64 115, 32 115, 30 112 C 24 98, 30 84, 39 72 Z"
        fill="url(#baseWater)" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
  <!-- Glass highlight -->
  <path d="M 35 84 C 32 92, 32 100, 35 107" fill="none" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/>
</svg>
